<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>STACKFALL · 블록 퍼즐</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="logo">STACK<span>FALL</span></h1>
    <div class="topbar-actions">
      <button id="btn-mute" class="chip" title="소리 켜기/끄기 (M)">🔊 소리</button>
      <span id="db-status" class="chip chip-muted">DB 확인 중…</span>
    </div>
  </header>

  <main class="layout">
    <!-- 왼쪽: 홀드 + 정보 -->
    <aside class="panel side">
      <section class="card">
        <h2>HOLD <small>(C)</small></h2>
        <canvas id="hold" width="120" height="120"></canvas>
      </section>
      <section class="card stats">
        <div><label>점수</label><strong id="score">0</strong></div>
        <div><label>라인</label><strong id="lines">0</strong></div>
        <div><label>레벨</label><strong id="level">1</strong></div>
      </section>
      <section class="card keys">
        <h2>조작법</h2>
        <ul>
          <li><kbd>←</kbd><kbd>→</kbd> 이동</li>
          <li><kbd>↓</kbd> 소프트 드롭</li>
          <li><kbd>↑</kbd>/<kbd>X</kbd> 회전 · <kbd>Z</kbd> 역회전</li>
          <li><kbd>Space</kbd> 하드 드롭</li>
          <li><kbd>C</kbd> 홀드 · <kbd>P</kbd> 일시정지</li>
          <li><kbd>M</kbd> 소리 끄기</li>
        </ul>
      </section>
    </aside>

    <!-- 가운데: 보드 -->
    <section class="board-wrap">
      <canvas id="board" width="300" height="600"></canvas>
      <div id="overlay" class="overlay">
        <div class="overlay-box" id="overlay-start">
          <h2>STACKFALL</h2>
          <p>줄을 채워 블록을 지우세요.</p>
          <button id="btn-start" class="btn primary">게임 시작</button>
        </div>
        <div class="overlay-box hidden" id="overlay-pause">
          <h2>일시정지</h2>
          <button id="btn-resume" class="btn primary">계속하기</button>
        </div>
        <div class="overlay-box hidden" id="overlay-over">
          <h2>GAME OVER</h2>
          <p class="final">점수 <strong id="final-score">0</strong></p>
          <form id="score-form">
            <input id="nickname" maxlength="20" placeholder="닉네임 (최대 20자)" required autocomplete="off" />
            <button type="submit" class="btn primary" id="btn-save">점수 저장</button>
          </form>
          <p id="save-msg" class="msg"></p>
          <button id="btn-restart" class="btn">다시 하기</button>
        </div>
      </div>
    </section>

    <!-- 오른쪽: 다음 블록 + 랭킹 -->
    <aside class="panel side">
      <section class="card">
        <h2>NEXT</h2>
        <canvas id="next" width="120" height="300"></canvas>
      </section>
      <section class="card">
        <h2>TOP 10 <button id="btn-refresh" class="link" title="새로고침">↻</button></h2>
        <ol id="leaderboard" class="leaderboard"><li class="empty">불러오는 중…</li></ol>
      </section>
    </aside>
  </main>

  <!-- 모바일 터치 컨트롤 -->
  <div class="touch">
    <button data-act="left">◀</button>
    <button data-act="rotate">⟳</button>
    <button data-act="right">▶</button>
    <button data-act="down">▼</button>
    <button data-act="drop">⤓</button>
    <button data-act="hold">H</button>
  </div>

  <!-- 피드백 -->
  <section class="feedback">
    <div class="card">
      <h2>피드백 남기기</h2>
      <form id="feedback-form" class="feedback-form">
        <div class="row">
          <input id="fb-name" maxlength="20" placeholder="닉네임" required autocomplete="off" />
          <div class="rating" id="fb-rating" role="radiogroup" aria-label="평점">
            <button type="button" data-v="1">★</button><button type="button" data-v="2">★</button><button type="button" data-v="3">★</button><button type="button" data-v="4">★</button><button type="button" data-v="5">★</button>
          </div>
        </div>
        <textarea id="fb-message" maxlength="500" rows="3" placeholder="게임에 대한 의견을 자유롭게 남겨주세요 (최대 500자)" required></textarea>
        <div class="row end">
          <span id="fb-count" class="muted">0 / 500</span>
          <button type="submit" class="btn primary" id="btn-fb">등록</button>
        </div>
        <p id="fb-msg" class="msg"></p>
      </form>
    </div>
    <div class="card">
      <h2>최근 피드백</h2>
      <ul id="feedback-list" class="feedback-list"><li class="empty">불러오는 중…</li></ul>
    </div>
  </section>

  <footer class="foot">STACKFALL · Supabase + Vercel</footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
